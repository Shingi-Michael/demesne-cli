name: Linux graphics
on:
  push:
    branches: [main, codex/linux-graphics-startup]
    paths: ['apps/**', 'packages/**', 'scripts/**', 'package.json', 'bun.lock', '.github/linux/**', '.github/workflows/graphics-linux.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'scripts/**', 'package.json', 'bun.lock', '.github/linux/**', '.github/workflows/graphics-linux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-graphics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graphics:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '24.04']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Build from tracked files only: no checkout credentials or host dependencies in the image.
      - name: Build isolated desktop fixture
        run: git archive HEAD | docker build --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }} -f .github/linux/Dockerfile -t demesne-linux -
      # SYS_ADMIN + relaxed container syscall policy allow the SUID helper to create its
      # PID/network namespaces. Chromium's own renderer sandbox remains enabled.
      # No host mounts, Docker socket, secrets, published ports or model requests.
      - name: Reproduce, repair and render
        run: docker run --name demesne-linux-check --cpus=2 --memory=3g --pids-limit=512 --shm-size=256m --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined demesne-linux
      - name: Collect captures
        if: always()
        run: |
          docker cp demesne-linux-check:/workspace/test-results ./test-results || true
          docker rm -f demesne-linux-check || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-graphics-${{ matrix.ubuntu }}
          path: test-results/
          if-no-files-found: ignore
