name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      version:
        description: "Explicit version (overrides bump, e.g. 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.step_version.outputs.version }}
      tag: ${{ steps.step_version.outputs.tag }}
      should_release: ${{ steps.step_version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - id: step_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            ver="${tag#v}"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args=("--github")
            if [ -n "${{ github.event.inputs.version }}" ]; then
              args+=("--set=${{ github.event.inputs.version }}")
            elif [ "${{ github.event.inputs.bump }}" != "none" ]; then
              args+=("--bump=${{ github.event.inputs.bump }}")
            fi
            bun run scripts/version.ts "${args[@]}"
          else
            bun run scripts/version.ts --github
          fi

  # The desktop app, so installing demesne needs neither Bun nor Rust. Each
  # bundle carries its own daemon, desktop host and native image runtime.
  desktop:
    name: Desktop / ${{ matrix.artifact }}
    needs: [version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: demesne-desktop-darwin-arm64.zip
          # Built on 22.04 so the package also installs on 24.04.
          - os: ubuntu-22.04
            artifact: demesne-desktop-linux-amd64.deb
          - os: windows-latest
            artifact: demesne-desktop-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Build app bundle
        shell: bash
        run: |
          export DEMESNE_BUILD_VERSION="${{ needs.version.outputs.version }}"
          bun run build:desktop

      # Check each bundle carries its backend, since copying only the
      # executable would leave the app without a daemon.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=apps/desktop/release/mac-arm64/Demesne.app
          for file in demesne-desktop-host demesned; do test -x "$app/Contents/Resources/backend/$file"; done
          test -d "$app/Contents/Resources/backend/node_modules/sharp"
          ditto -c -k --keepParent "$app" "${{ matrix.artifact }}"
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/release/*.deb "${{ matrix.artifact }}"
          contents=$(dpkg-deb -c "${{ matrix.artifact }}")
          for file in usr/bin/demesne-desktop resources/backend/demesne-desktop-host resources/backend/demesned resources/backend/node_modules/sharp/; do grep -q "$file" <<<"$contents"; done
          sudo apt-get install -y "./${{ matrix.artifact }}"
          command -v demesne-desktop
          # The portable bundle install.sh unpacks on any x86_64 glibc distro.
          mkdir -p portable && cp -a apps/desktop/release/linux-unpacked portable/demesne
          cp apps/desktop/build/icon.png portable/demesne/icon.png
          tar -czf demesne-desktop-linux-x64.tar.gz -C portable demesne
          contents=$(tar -tzf demesne-desktop-linux-x64.tar.gz)
          for file in demesne/demesne-desktop demesne/icon.png demesne/resources/backend/demesne-desktop-host demesne/resources/backend/demesned demesne/resources/backend/node_modules/sharp/; do grep -q "^$file" <<<"$contents"; done
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: cp apps/desktop/release/*.exe "${{ matrix.artifact }}"
      - name: Checksum
        shell: bash
        run: |
          for p in "${{ matrix.artifact }}" demesne-desktop-linux-x64.tar.gz; do
            [ -f "$p" ] || continue
            bun -e 'const p=process.argv[1]; const bytes=await Bun.file(p).arrayBuffer(); await Bun.write(p+".sha256",new Bun.CryptoHasher("sha256").update(bytes).digest("hex")+"  "+p+"\n")' "$p"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            demesne-desktop-linux-x64.tar.gz*
          if-no-files-found: ignore

  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Tag commit on origin if missing
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag" || true
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true

  # TODO before public distribution: import a Developer ID certificate, sign
  # and notarize Demesne.app, and publish the stapled archive.
