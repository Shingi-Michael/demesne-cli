name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      version:
        description: "Explicit version (overrides bump, e.g. 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.step_version.outputs.version }}
      tag: ${{ steps.step_version.outputs.tag }}
      should_release: ${{ steps.step_version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - id: step_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            ver="${tag#v}"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args=("--github")
            if [ -n "${{ github.event.inputs.version }}" ]; then
              args+=("--set=${{ github.event.inputs.version }}")
            elif [ "${{ github.event.inputs.bump }}" != "none" ]; then
              args+=("--bump=${{ github.event.inputs.bump }}")
            fi
            bun run scripts/version.ts "${args[@]}"
          else
            bun run scripts/version.ts --github
          fi
      # Each build uploads its files straight to this draft, since Actions
      # artifact storage has a quota that, once full, fails every upload.
      # The updater reads releases/latest, which never names a draft, so
      # the release appears only once every build is in.
      - name: Open draft release
        if: steps.step_version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.step_version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  # The build jobs upload straight to a draft release rather than through
  # workflow artifacts, which count against the account's Actions storage
  # quota (release assets don't). The release job publishes the draft once
  # every build has uploaded, so a failed build still publishes nothing.
  draft:
    name: Draft Release
    needs: [version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "${{ github.sha }}" --title "$tag" --generate-notes
          fi

  # The desktop app, so installing demesne needs neither Bun nor Rust. Each
  # bundle carries its own daemon, desktop host and native image runtime.
  desktop:
    name: Desktop / ${{ matrix.artifact }}
    needs: [version, draft]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: demesne-darwin-arm64.zip
          # Built on 22.04 so the package also installs on 24.04.
          - os: ubuntu-22.04
            artifact: demesne-linux-amd64.deb
          - os: windows-latest
            artifact: demesne-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # electron-builder downloads Electron and its packaging tools from
      # GitHub on every run; a 504 there fails the whole release. Keep them
      # in one cache path on every OS so later runs skip the download.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/desktop/electron-builder.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Build app bundle
        shell: bash
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
        run: |
          export DEMESNE_BUILD_VERSION="${{ needs.version.outputs.version }}"
          # Retry so a transient download error (such as a 504) doesn't
          # fail the release; a real build error still fails all attempts.
          for attempt in 1 2 3; do
            if bun run build:desktop; then exit 0; fi
            [ "$attempt" -lt 3 ] && { echo "::warning::build:desktop failed (attempt $attempt), retrying in 30s"; sleep 30; }
          done
          exit 1

      # Check each bundle carries its backend, since copying only the
      # executable would leave the app without a daemon.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=apps/desktop/release/mac-arm64/Demesne.app
          for file in demesne-host demesne-desktop-host demesned; do test -x "$app/Contents/Resources/backend/$file"; done
          test -d "$app/Contents/Resources/backend/node_modules/sharp"
          ditto -c -k --keepParent "$app" "${{ matrix.artifact }}"
          # Compatibility for saved copies of the old installer.
          cp "${{ matrix.artifact }}" demesne-desktop-darwin-arm64.zip
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/release/*.deb "${{ matrix.artifact }}"
          test "$(dpkg-deb -f "${{ matrix.artifact }}" Package)" = demesne
          for field in Replaces Conflicts; do
            dpkg-deb -f "${{ matrix.artifact }}" "$field" | grep -qw demesne-desktop
          done
          contents=$(dpkg-deb -c "${{ matrix.artifact }}")
          for file in opt/Demesne/demesne resources/backend/demesne-host resources/backend/demesned resources/backend/node_modules/sharp/; do
            if ! grep -q "$file" <<<"$contents"; then
              echo "Missing expected file in deb: $file"
              echo "deb contents:"
              echo "$contents"
              exit 1
            fi
          done
          sudo apt-get update -q || true
          sudo apt-get install -y "./${{ matrix.artifact }}"
          command -v demesne
          # The portable bundle install.sh unpacks on any x86_64 glibc distro.
          mkdir -p portable && cp -a apps/desktop/release/linux-unpacked portable/demesne
          cp apps/desktop/build/icon.png portable/demesne/icon.png
          # Old installers validate this executable before swapping the app.
          ln -s demesne portable/demesne/demesne-desktop
          tar -czf demesne-linux-x64.tar.gz -C portable demesne
          cp demesne-linux-x64.tar.gz demesne-desktop-linux-x64.tar.gz
          contents=$(tar -tzf demesne-linux-x64.tar.gz)
          for file in demesne/demesne demesne/demesne-desktop demesne/icon.png demesne/resources/backend/demesne-host demesne/resources/backend/demesne-desktop-host demesne/resources/backend/demesned demesne/resources/backend/node_modules/sharp/; do
            if ! grep -q "^$file" <<<"$contents"; then
              echo "Missing expected file in tar.gz: $file"
              echo "tar.gz contents:"
              echo "$contents"
              exit 1
            fi
          done
          for file in demesne demesne-desktop resources/backend/demesne-host resources/backend/demesne-desktop-host resources/backend/demesned; do
            test -x "portable/demesne/$file"
          done
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: cp apps/desktop/release/*.exe "${{ matrix.artifact }}"
      - name: Checksum
        shell: bash
        run: |
          for p in "${{ matrix.artifact }}" demesne-linux-x64.tar.gz demesne-desktop-linux-x64.tar.gz demesne-desktop-darwin-arm64.zip; do
            [ -f "$p" ] || continue
            bun -e 'const p=process.argv[1]; const bytes=await Bun.file(p).arrayBuffer(); await Bun.write(p+".sha256",new Bun.CryptoHasher("sha256").update(bytes).digest("hex")+"  "+p+"\n")' "$p"
          done

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=("${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256" demesne-linux-x64.tar.gz* demesne-desktop-linux-x64.tar.gz* demesne-desktop-darwin-arm64.zip*)
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          gh release upload "$TAG" "${existing[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit on origin if missing
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag" || true
          fi
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
