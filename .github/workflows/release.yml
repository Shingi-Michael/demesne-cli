name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: demesne-darwin-arm64
            smoke: true
          - target: bun-darwin-x64
            artifact: demesne-darwin-x64
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # See ci.yml: the agent benchmark fixtures run `bun test` through
      # run_command, whose fixed PATH does not include ~/.bun/bin.
      - run: sudo mkdir -p /usr/local/bin && sudo ln -sf "$(command -v bun)" /usr/local/bin/bun
      # The tools tests exercise search_files with and without ripgrep.
      - run: command -v rg || brew install ripgrep
      # Both Mac architectures' sharp binaries, so the x64 daemon can carry its own.
      - run: bun install --frozen-lockfile --os=darwin --cpu='*'
      - run: bun run typecheck
      - run: bun test

      - name: Build binaries
        run: |
          mkdir -p release
          bun build apps/cli/src/main.ts --compile --target=${{ matrix.target }} --outfile release/demesne
          # The daemon loads sharp from node_modules beside its real path.
          bun run scripts/build-daemon.ts --target=${{ matrix.target }}
          cp dist/demesned release/demesned
          cp -R dist/node_modules release/node_modules
          test -f release/node_modules/sharp/dist/index.cjs

      # The arm64 runner can execute the arm64 artifact natively. The x64
      # artifact is only syntax-checked here; signing and a native smoke test
      # belong to the notarization step once release credentials exist.
      # The daemon check boots it through a symlink, as install.sh lays it out.
      - name: Smoke test native artifact
        if: matrix.smoke
        run: |
          ./release/demesne --version
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf "$PWD/release/demesned" "$RUNNER_TEMP/bin/demesned"
          bun scripts/check-desktop-backend.ts "$RUNNER_TEMP/bin/demesned" --beside

      - name: Package and checksum
        run: |
          cd release
          tar -czf "../${{ matrix.artifact }}.tar.gz" demesne demesned node_modules
          cd ..
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          cat "${{ matrix.artifact }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  # The desktop app, so installing demesne needs neither Bun nor Rust. Each
  # bundle carries its own daemon, desktop host and native image runtime.
  desktop:
    name: Desktop / ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: demesne-desktop-darwin-arm64.zip
          # Built on 22.04 so the package also installs on 24.04.
          - os: ubuntu-22.04
            artifact: demesne-desktop-linux-amd64.deb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile

      # A tag sets the app's version; a manual run keeps tauri.conf.json's.
      - name: Build app bundle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bun run build:desktop -- --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
          else
            bun run build:desktop
          fi

      # Check each bundle carries its backend, since copying only the
      # executable would leave the app without a daemon.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/Demesne.app
          for file in demesne-desktop-host demesned; do test -x "$app/Contents/MacOS/$file"; done
          test -d "$app/Contents/Resources/runtime/node_modules/sharp"
          ditto -c -k --keepParent "$app" "${{ matrix.artifact }}"
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "${{ matrix.artifact }}"
          contents=$(dpkg-deb -c "${{ matrix.artifact }}")
          for file in usr/bin/demesne-desktop usr/bin/demesne-desktop-host usr/bin/demesned runtime/node_modules/sharp/; do grep -q "$file" <<<"$contents"; done
          sudo apt-get install -y "./${{ matrix.artifact }}"
          command -v demesne-desktop
      - name: Checksum
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256" && cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # TODO before public distribution:
  # - Import a Developer ID certificate, then sign and notarize the archives
  #   and Demesne.app.
  # - Staple the notarization ticket and publish the stapled archives.
  # - Add an x86_64 native smoke test on an Intel runner or under Rosetta.
