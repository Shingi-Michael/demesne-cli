name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The desktop app, so installing demesne needs neither Bun nor Rust. Each
  # bundle carries its own daemon, desktop host and native image runtime.
  desktop:
    name: Desktop / ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: demesne-desktop-darwin-arm64.zip
          # Built on 22.04 so the package also installs on 24.04.
          - os: ubuntu-22.04
            artifact: demesne-desktop-linux-amd64.deb
          - os: windows-latest
            artifact: demesne-desktop-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build app bundle
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export DEMESNE_BUILD_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bun run build:desktop

      # Check each bundle carries its backend, since copying only the
      # executable would leave the app without a daemon.
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app=apps/desktop/release/mac-arm64/Demesne.app
          for file in demesne-desktop-host demesned; do test -x "$app/Contents/Resources/backend/$file"; done
          test -d "$app/Contents/Resources/backend/node_modules/sharp"
          ditto -c -k --keepParent "$app" "${{ matrix.artifact }}"
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/release/*.deb "${{ matrix.artifact }}"
          contents=$(dpkg-deb -c "${{ matrix.artifact }}")
          for file in usr/bin/demesne-desktop resources/backend/demesne-desktop-host resources/backend/demesned resources/backend/node_modules/sharp/; do grep -q "$file" <<<"$contents"; done
          sudo apt-get install -y "./${{ matrix.artifact }}"
          command -v demesne-desktop
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: cp apps/desktop/release/*.exe "${{ matrix.artifact }}"
      - name: Checksum
        shell: bash
        run: bun -e 'const p=process.argv[1]; const bytes=await Bun.file(p).arrayBuffer(); await Bun.write(p+".sha256",new Bun.CryptoHasher("sha256").update(bytes).digest("hex")+"  "+p+"\n")' "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # TODO before public distribution: import a Developer ID certificate, sign
  # and notarize Demesne.app, and publish the stapled archive.
