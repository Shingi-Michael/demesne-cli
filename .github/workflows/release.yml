name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: demesne-darwin-arm64
            smoke: true
          - target: bun-darwin-x64
            artifact: demesne-darwin-x64
            smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # See ci.yml: the agent benchmark fixtures run `bun test` through
      # run_command, whose fixed PATH does not include ~/.bun/bin.
      - run: sudo mkdir -p /usr/local/bin && sudo ln -sf "$(command -v bun)" /usr/local/bin/bun
      # The tools tests exercise search_files with and without ripgrep.
      - run: command -v rg || brew install ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Build binaries
        run: |
          mkdir -p release
          bun build apps/cli/src/main.ts --compile --target=${{ matrix.target }} --outfile release/demesne
          bun build apps/daemon/src/main.ts --compile --target=${{ matrix.target }} --outfile release/demesned

      # The arm64 runner can execute the arm64 artifact natively. The x64
      # artifact is only syntax-checked here; signing and a native smoke test
      # belong to the notarization step once release credentials exist.
      - name: Smoke test native artifact
        if: matrix.smoke
        run: |
          ./release/demesne --version
          ./release/demesned --help 2>&1 || true

      - name: Package and checksum
        run: |
          cd release
          tar -czf "../${{ matrix.artifact }}.tar.gz" demesne demesned
          cd ..
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          cat "${{ matrix.artifact }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  # The desktop app, built on each platform it ships for (the Bun sidecars
  # and native image codecs must match the machine they run on). Tests run
  # in the build job above and in desktop.yml; this job only packages.
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: Demesne-darwin-arm64.app.tar.gz
          # The oldest supported Ubuntu, so the .deb's glibc floor stays low.
          - os: ubuntu-22.04
            artifact: demesne-desktop-linux-x64.deb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf "${{ matrix.artifact }}" -C "$bundle/macos" Demesne.app
          else
            debs=("$bundle"/deb/*.deb)
            [ "${#debs[@]}" -eq 1 ] || { echo "expected one .deb, found ${#debs[@]}" >&2; exit 1; }
            cp "${debs[0]}" "${{ matrix.artifact }}"
            dpkg-deb --info "${{ matrix.artifact }}"
          fi
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # TODO before public distribution:
  # - Import a Developer ID certificate, sign and notarize the archives and
  #   Demesne.app (until then macOS quarantines a browser-downloaded app).
  # - Staple the notarization ticket and publish the stapled archives.
  # - Add an x86_64 native smoke test on an Intel runner or under Rosetta.
